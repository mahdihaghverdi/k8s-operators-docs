name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
  repository-projects: read
jobs:
  build-and-deply:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/checkout@v4
        with:
          repository: mahdihaghverdi/ConfigBundleOperator
          path: ConfigBundleOperator
          token: ${{ secrets.TOKEN }}
          ref: main

      - uses: actions/setup-python@v6
      - run: |
          python scripts/generate_zensical.toml.py
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
